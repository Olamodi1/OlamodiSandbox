<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="t">
  <title id="t">Timeline of HTTP versions: 1991, 1996, 1997, 2015, 2022</title>
  <rect width="720" height="200" fill="#fff"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <line x1="40" y1="100" x2="680" y2="100" stroke="#1f3a5f" stroke-width="4"/>
    <g fill="#2e7d9a"><circle cx="70" cy="100" r="10"/><circle cx="210" cy="100" r="10"/><circle cx="310" cy="100" r="10"/><circle cx="490" cy="100" r="10"/><circle cx="650" cy="100" r="10"/></g>
    <g font-size="17" font-weight="700" fill="#1f3a5f"><text x="70" y="70">1991</text><text x="210" y="70">1996</text><text x="310" y="70">1997</text><text x="490" y="70">2015</text><text x="650" y="70">2022</text></g>
    <g font-size="15" fill="#25303b"><text x="70" y="140">HTTP/0.9</text><text x="210" y="140">HTTP/1.0</text><text x="310" y="140">HTTP/1.1</text><text x="490" y="140">HTTP/2</text><text x="650" y="140">HTTP/3</text></g>
    <g font-size="12" fill="#5d6b79"><text x="70" y="160">GET only</text><text x="210" y="160">headers, codes</text><text x="310" y="160">persistent conn.</text><text x="490" y="160">multiplexing</text><text x="650" y="160">QUIC / UDP</text></g>
  </g>
</svg>
